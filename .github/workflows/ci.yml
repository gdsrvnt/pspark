name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Check ids
        run: uv run spark_id.py spark.json
      - name: Check schema
        run: uvx check-jsonschema --schemafile spark.schema.json spark.json
